[cursor.style]
shape = "Block"

[cursor.vi_mode_style]
shape = "Block"

[font]
size = 12

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font"
style = "Italic"

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[selection]
save_to_clipboard = true

[terminal.shell]
program = "/bin/zsh"
args = [ 
  "-l",
  # "-c", "tmux attach || tmux" 
]

[window]
opacity = 0.7
# none:        完全不显示,无法通过鼠标移动窗口
# transparent: 隐藏标题栏,但保留窗口控制按钮
# buttonless:  同时隐藏标题栏和窗口控制按钮
# 后两个选项在 macOS 上隐藏标题栏之后依旧可以通过顶部拖拽移动窗口
# 但是只要隐藏了标题栏就无法创建 tab 页
decorations = "buttonless"

[window.dimensions]
columns = 210
lines = 63

[env]
TERM = "xterm-256color"

[general]
import = [
  # uncomment the flavour you want below:
  # "~/.config/alacritty/catppuccin-latte.toml"
  # "~/.config/alacritty/catppuccin-frappe.toml"
  # "~/.config/alacritty/catppuccin-macchiato.toml"
  "~/.config/alacritty/catppuccin-mocha.toml"
]
