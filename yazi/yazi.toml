# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.

#:schema = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
ratio          = [1, 2, 2]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = []
title_format   = ""

[preview]
wrap            = "yes"
tab_size        = 2
max_width       = 3000
max_height      = 3000
cache_dir       = ""
image_delay     = 30
image_filter    = "triangle"
image_quality   = 50
sixel_fraction  = 10
ueberzug_scale  = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = "${EDITOR:-nvim} %s", desc = "$EDITOR",      for = "unix", block = true },
  { run = 'code %s', orphan = true, desc = "Visual Studio Code", for = "linux" },
]

open = [
  { run = 'open %s', orphan = true, desc = "Finder", for = "macos" },
  { run = 'code %s', orphan = true, desc = "Visual Studio Code", for = "linux" },
  { run = 'Typora %s', orphan = true, desc = "Typoea", for = "linux" },
]

img = [
  { run = 'feh -Z --zoom-step 3 --image-bg "#416e74" --keep-zoom-vp %s .', orphan = true, desc = "feh", for = "linux" },
  { run = 'open %s', orphan = true, desc = "feh", for = "macos" }
]

reveal = [
  { run = '''exiftool %s; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF", for = "linux" },
  { run = 'file %s', block = true, desc = "Show EXIF", for = "macos" }
]

extract = [{ run = 'ya pub extract --list %s', desc = "Extract here", for = "unix" }]

play = [
  { run = 'mpv --force-window %s', orphan = true, for = "unix" },
  { run = 'vlc %s',                orphan = true, for = "unix" },
  { run = 'open %s',               orphan = true, for = "macos" },
  { run = '''mediainfo %s; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]

md = [
  { run = '${EDITOR:-vi} %s', desc = "$EDITOR", block = true, for = "unix" },
  { run = 'code %s', orphan = true, desc = "Visual Studio Code", for = "linux" },
  { run = 'Typora %s', orphan = true, desc = "Typoea", for = "linux" },
]

browser = [
  { run = 'google-chrome %s', orphan = true, desc = "Google Chrome", for = "linux" },
  { run = 'firefox %s',       orphan = true, desc = "FireFox",       for = "linux" },
]

[open]
rules = [
  { url = "*.md",   use = "md" },
  { url = "*.pdf",  use = "browser" },
  { url = "*.json", use = ["edit", "open", "reveal"] },
  { url = "*.html", use = ["edit", "browser"] },
  { url = "*.mp3",  use = "play" },
  # Folder
  { url = "*/", use = ["edit", "open", "reveal"] },
  # Text
  { mime = "text/*", use = ["edit", "reveal"] },
  # Image
  { mime = "image/*", use = ["img", "reveal"] },
  # Media
  { mime = "{audio,video}/*", use = ["play", "reveal"] },
  # Archive
  { mime = "application/{,g}zip",                            use = ["extract", "reveal"] },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", use = ["extract", "reveal"] },
  # JSON
  { mime = "application/{json,x-ndjson}", use = ["edit", "reveal"] },
  { mime = "*/javascript",                use = ["edit", "reveal"] },
  # Empty file
  { mime = "inode/x-empty", use = ["edit", "reveal"] },
  # Fallback
  { url = "*", use = ["open", "reveal"] },
]

[tasks]
micro_workers    = 10
macro_workers    = 25
bizarre_retry    = 5
image_alloc      = 536870912  # 512MB
image_bound      = [0, 0]
suppress_preload = false

[plugin]
fetchers = [
  # Mimetype
  { group = "mime", url = "*", run = "mime.local", if = "!mime", prio = "high" },
  { group = "mime", url = "*/", run = "mime.dir", prio = "high" },
]

preloaders = [
  # Image
  { mime = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
  { mime = "image/*", run = "image" },
  # Video
  { mime = "video/*", run = "video" },
  # PDF
  { mime = "application/pdf", run = "pdf" },
  # Font
  { mime = "font/*", run = "font" },
  { mime = "application/vnd.ms-opentype", run = "font" },
]

previewers = [
  { url = "*/", run = "folder", sync = true },
  # Code
  { mime = "text/*", run = "code" },
  { mime = "*/{xml,javascript,x-wine-extension-ini}", run = "code" },
  # JSON
  { mime = "application/{json,x-ndjson}", run = "json" },
  # Image
  { mime = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
  { mime = "image/*", run = "image" },
  # Video
  { mime = "video/*", run = "video" },
  # PDF
  { mime = "application/pdf", run = "pdf" },
  # Archive
  { mime = "application/{,g}zip", run = "archive" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar,iso9660-image}", run = "archive" },
  # Font
  { mime = "font/*", run = "font" },
  { mime = "application/vnd.ms-opentype", run = "font" },
  # Empty file
  { mime = "inode/x-empty", run = "empty" },

  # plugin: yazi-rs/plugins:piper
  { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -s=dark "$1"' },
  { url = "*",    run = 'piper -- echo "$1"' },
  { url = "*/",   run = 'piper -- eza -TL=3 --color=always --icons=always --group-directories-first --no-quotes "$1"'},

  # Fallback
  { url = "*", run = "file" },
]

prepend_preloaders = [
  # plugin: ENEmyr/center-media
  { mime = "video/*", run  = "center-media --no-preview" },
  { mime = "{audio,video,image}/*",                                                         run = "center-media" },
  { mime = "application/{subrip,postscript,illustrator,dvb.ait,vnd.adobe.illustrator,eps}", run = "center-media" },
  { url = "*.{ai,eps,ait}",                                                                 run = "center-media" },
]

prepend_previewers = [
  # plugin: ENEmyr/center-media
  { mime = "video/*", run  = "center-media --no-preview" },
  { mime = "{audio,video,image}/*",                                                         run = "center-media" },
  { mime = "application/{subrip,postscript,illustrator,dvb.ait,vnd.adobe.illustrator,eps}", run = "center-media" },
  { url = "*.{ai,eps,ait}",                                                                 run = "center-media" },
]

[input]
cursor_blink = false

# cd
cd_title  = "Change directory:"
cd_origin = "top-center"
cd_offset = [0, 2, 50, 3]

# create
create_title = ["Create:", "Create (dir):"]
create_origin = "top-center"
create_offset = [0, 2, 50, 3]

# reurl
reurl_title  = "Rename:"
reurl_origin = "hovered"
reurl_offset = [0, 1, 50, 3]

# filter
filter_title  = "Filter:"
filter_origin = "top-center"
filter_offset = [0, 2, 50, 3]

# find
find_title  = ["Find next:", "Find previous:"]
find_origin = "top-center"
find_offset = [0, 2, 50, 3]

# search
search_title  = "Search via {n}:"
search_origin = "top-center"
search_offset = [0, 2, 50, 3]

# shell
shell_title  = ["Shell:", "Shell (block):"]
shell_origin = "top-center"
shell_offset = [0, 2, 50, 3]

[confirm]
# trash
trash_title   = "Trash {n} selected file{s}?"
trash_origin  = "center"
trash_offset  = [0, 0, 70, 20]

# delete
delete_title   = "Permanently delete {n} selected file{s}?"
delete_origin  = "center"
delete_offset  = [0, 0, 70, 20]

# overwrite
overwrite_title   = "Overwrite file?"
overwrite_content = "Will overwrite the following file:"
overwrite_origin  = "center"
overwrite_offset  = [0, 0, 50, 15]

# quit
quit_title   = "Quit?"
quit_content = "The following task is still running, are you sure you want to quit?"
quit_origin  = "center"
quit_offset  = [0, 0, 50, 15]

[select]
open_title  = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 7]

[which]
sort_by         = "none"
sort_sensitive = false
sort_reverse    = false
sort_translit  = false

[log]
enabled = false

